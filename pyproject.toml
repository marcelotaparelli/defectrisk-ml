[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "defectrisk-ml"
version = "0.1.0"
description = "Predicting software module defects from static software metrics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<4", "scikit-learn>=1.5,<2", "xgboost-cpu==3.4.1"]

[project.optional-dependencies]
dev = ["pytest"]
report = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: loads the actual OpenML dataset (network required on first run)"]
